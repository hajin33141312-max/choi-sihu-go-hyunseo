<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>최시후와 고현서 — 일탈 연애 편</title>
  <meta name="description" content="사회문화 일탈 이론을 이야기로 풀어낸 인터랙티브 스토리" />
  <style>
    :root {
      --bg: #09090b;
      --panel: rgba(18, 18, 22, 0.78);
      --line: rgba(255,255,255,.10);
      --text: #f5f5f5;
      --muted: #a9a9b3;
      --accent: #ff7aa8;
      --accent-soft: rgba(255,122,168,.16);
      --shadow: 0 30px 80px rgba(0,0,0,.38);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,122,168,.08), transparent 30%),
        radial-gradient(circle at 80% 85%, rgba(255,255,255,.04), transparent 30%),
        #09090b;
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      position: relative;
    }

    header {
      padding: 22px clamp(20px, 4vw, 48px) 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: relative;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -.02em;
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 22px rgba(255,122,168,.8);
    }

    .brand-title {
      font-weight: 700;
      font-size: 14px;
    }

    .chapter {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    main {
      display: grid;
      place-items: center;
      padding: 10px 20px 30px;
    }

    .story-shell {
      width: min(980px, 100%);
      height: min(72vh, 760px);
      min-height: 460px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015));
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .story-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,.025) 50%, transparent 100%);
    }

    .progress {
      height: 3px;
      background: rgba(255,255,255,.05);
    }

    .progress > span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      box-shadow: 0 0 16px rgba(255,122,168,.55);
      transition: width .35s ease;
    }

    .content {
      height: calc(100% - 3px);
      padding: clamp(28px, 5vw, 62px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 54px);
      line-height: 1.08;
      letter-spacing: -.04em;
      margin: 0 0 24px;
      max-width: 760px;
    }

    .story-text {
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.9;
      color: #e9e9ed;
      max-width: 820px;
      white-space: pre-line;
      min-height: 260px;
    }

    .highlight {
      color: #fff;
      font-weight: 800;
    }

    .theory {
      margin-top: 24px;
      padding: 15px 17px;
      border: 1px solid rgba(255,122,168,.18);
      border-radius: 14px;
      background: var(--accent-soft);
      color: #ffd8e5;
      font-size: 13px;
      line-height: 1.7;
      max-width: 820px;
    }

    .theory strong {
      color: #fff;
    }

    .scene-count {
      position: absolute;
      right: 26px;
      top: 23px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }

    footer {
      padding: 12px clamp(20px, 4vw, 48px) 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      z-index: 5;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .controls button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.035);
      color: #eee;
      border-radius: 11px;
      padding: 9px 14px;
      cursor: pointer;
      transition: .18s ease;
    }

    .controls button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: rgba(255,255,255,.07);
      border-color: rgba(255,255,255,.18);
    }

    .controls button:disabled {
      opacity: .35;
      cursor: default;
    }

    .controls .primary {
      background: var(--accent-soft);
      border-color: rgba(255,122,168,.3);
      color: #ffe8f0;
    }

    .hint {
      position: absolute;
      bottom: 11px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #777780;
      pointer-events: none;
    }

    .fade-in {
      animation: fade .32s ease both;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 720px) {
      body { overflow: auto; }
      .app { min-height: 100dvh; }
      main { padding-bottom: 14px; }
      .story-shell { min-height: 610px; height: 70dvh; border-radius: 20px; }
      .content { padding: 34px 24px 28px; }
      .story-text { min-height: 310px; }
      .scene-count { top: 18px; right: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-title">최시후와 고현서 — 일탈 연애 편</span>
      </div>
      <div class="chapter" id="chapterLabel">Intro</div>
    </header>

    <main>
      <section class="story-shell" aria-live="polite">
        <div class="progress"><span id="progressBar"></span></div>
        <div class="content" id="content"></div>
      </section>
    </main>

    <footer>
      <div class="controls">
        <button id="firstBtn">⏮ 처음</button>
        <button id="prevBtn">◀ 이전</button>
        <button id="pauseBtn" class="primary">⏸ 일시정지</button>
        <button id="nextBtn" class="primary">다음 ▶</button>
      </div>
      <div class="hint">← → 키로 이동 · Space로 일시정지</div>
    </footer>
  </div>

  <script>
    const scenes = [
      {
        label: 'INTRO',
        title: '회사에서 제일 눈에 띄는 두 사람',
        text: '최시후와 고현서는 같은 회사에서 일하는 연인이었다.\n잘생긴 최시후와 예쁜 고현서는 둘이 지나가기만 해도 시선이 따라붙었다.\n\n회사에서는 모르는 척했지만, 퇴근하면 누구보다 달달한 커플이었다.\n고현서가 다른 사람과 웃으며 이야기하면 최시후는 괜히 질투했고,\n최시후가 인기가 많다는 걸 고현서는 누구보다 잘 알고 있었다.\n\n“왜 그렇게 쳐다봐?”\n“내 여자친구가 예뻐서.”\n“갑자기 그런 말 하면 반칙인데.”',
        theory: ''
      },
      {
        label: 'DURKHEIM',
        title: '1. 회사가 갑자기 이상해졌다',
        text: '어느 날 회사는 평가제도를 완전히 바꿨다.\n실적뿐 아니라 인간관계, 참여도, 고객 평가까지 점수에 들어갔다.\n직원들은 하루아침에 무엇이 중요한지 알 수 없게 되었다.\n\n최시후와 고현서는 점점 회사 규정을 대충 지키기 시작했다.\n출퇴근 기록도 대충 쓰고, 근무시간에 몰래 데이트도 했다.\n\n“규칙이 매일 바뀌는데 우리가 굳이 다 지켜야 해?”\n“맞아. 오늘의 규칙은 내일의 폐기물이니까.”\n\n그러다 고현서가 최시후의 넥타이를 잡아당겼다.\n“근데 지금 근무시간인데?”\n“그래서 더 재밌지.”',
        theory: '<strong>뒤르켐의 아노미 이론</strong> — 사회의 급변기로 기존 규범이 흔들리고 혼란이 발생하면서 일탈이 나타난다.'
      },
      {
        label: 'MERTON',
        title: '2. 갖고 싶은 건 많은데, 합법적인 방법은 부족했다',
        text: '둘은 높은 평가와 큰 성과급을 받고 싶었다.\n하지만 정상적인 방법만으로는 원하는 결과를 얻기 어려웠다.\n\n결국 최시후는 실적을 조금 부풀렸고, 고현서는 고객 평가 자료를 조작했다.\n\n“이거 들키면 어떡해?”\n“안 들키면?”\n“……”\n“그러니까 들키지 말자.”\n\n고현서는 피식 웃으며 말했다.\n“너 진짜 능글맞아.”\n“그래도 내 여자친구는 나 좋아하잖아.”\n\n고현서는 대답 대신 그의 팔을 끌어당겼다.',
        theory: '<strong>머튼의 아노미 이론</strong> — 사회적으로 인정되는 목표와 그것을 달성할 합법적인 수단 사이의 괴리가 일탈을 유발한다.'
      },
      {
        label: 'DIFFERENTIAL ASSOCIATION',
        title: '3. 친구를 잘못 사귀면 둘 다 배운다',
        text: '최시후에게는 친구 안정인이 있었고, 고현서에게는 친구 정지안이 있었다.\n둘 다 “이 정도는 다들 한다”는 말을 너무 쉽게 하는 사람들이었다.\n\n안정인은 회사 규정을 피해 가는 방법을 알려줬고, 정지안은 비용을 처리하는 꼼수를 알려줬다.\n최시후와 고현서는 처음에는 어이없어했지만, 자주 어울리면서 어느새 따라 하고 있었다.\n\n회사 물품을 슬쩍 개인적으로 쓰고, 회식비를 다른 용도로 쓰고,\n근무시간에 데이트하는 것도 어느 순간 아무렇지 않아졌다.\n\n“이거 잘못된 거 아냐?”\n“우리 친구들이 다 하는데?”\n“그럼 괜찮은 건가?”\n“아니. 그냥 둘이 같이 하면 덜 억울하잖아.”',
        theory: '<strong>차별적 교제이론</strong> — 일탈적인 사람들과 가까이 지내며 일탈 행동과 이를 정당화하는 방식을 학습한다.'
      },
      {
        label: 'LABELING',
        title: '4. “쟤들은 원래 저래.”',
        text: '결국 회사에 소문이 퍼졌다.\n\n“최시후랑 고현서는 원래 규칙 안 지키잖아.”\n“둘이 또 무슨 사고 치는 거 아니야?”\n\n처음에는 둘 다 억울했다.\n하지만 아무리 평범하게 행동해도 의심받자 생각이 바뀌었다.\n\n“어차피 사람들이 우리를 그렇게 보는데…”\n고현서가 말했다.\n“그럼 진짜 그렇게 살아볼까?”\n\n최시후는 웃으며 고현서의 손을 잡았다.\n“후회할 텐데?”\n“네가 같이 하면 안 할 것 같거든.”\n\n결국 작은 규칙 위반이었던 1차 일탈은 낙인을 거치며 더 큰 일탈인 2차 일탈로 이어졌다.',
        theory: '<strong>낙인이론</strong> — 작은 일탈인 <strong>1차 일탈</strong> 이후 ‘문제 있는 사람’이라는 낙인을 받아들이면서 <strong>2차 일탈</strong>로 발전한다.'
      },
      {
        label: 'ENDING',
        title: '둘이서 하면, 이상하게 덜 무서웠다',
        text: '결국 최시후와 고현서는 회사에서 가장 눈에 띄는 커플이면서 가장 사고를 많이 치는 커플이 되었다.\n\n퇴근길, 고현서가 최시후의 팔짱을 끼며 말했다.\n\n“우리 때문에 회사 난리 난 거 알지?”\n“알지.”\n“후회해?”\n\n최시후는 잠깐 고민하다가 웃었다.\n“일탈은 조금 후회하는데…”\n\n고현서가 그를 쳐다봤다.\n“그런데?”\n\n최시후가 손을 꼭 잡았다.\n“너랑 만난 건 하나도 안 후회해.”\n\n고현서는 얼굴을 살짝 붉히고 말했다.\n“그런 말로 넘어가려고?”\n\n“넘어가면 안 돼?”\n\n“오늘은 봐줄게.”\n\n그리고 두 사람은 아무렇지 않게 손을 잡은 채 집으로 향했다.',
        theory: '<strong>완성된 흐름</strong> — 사회의 급변기 → 목표와 합법적 수단의 괴리 → 일탈적 교제 → 낙인 → 1차 일탈에서 2차 일탈로 발전.'
      }
    ];

    let current = 0;
    let paused = false;
    let autoTimer = null;
    const autoDelay = 11000;

    const content = document.getElementById('content');
    const chapterLabel = document.getElementById('chapterLabel');
    const progressBar = document.getElementById('progressBar');
    const firstBtn = document.getElementById('firstBtn');
    const prevBtn = document.getElementById('prevBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const nextBtn = document.getElementById('nextBtn');

    function renderScene(instant = false) {
      const scene = scenes[current];
      const pct = ((current + 1) / scenes.length) * 100;

      content.innerHTML = '';
      content.className = 'content' + (instant ? '' : ' fade-in');

      const eyebrow = document.createElement('div');
      eyebrow.className = 'eyebrow';
      eyebrow.textContent = scene.label;

      const title = document.createElement('h1');
      title.textContent = scene.title;

      const text = document.createElement('div');
      text.className = 'story-text';
      text.textContent = scene.text;

      const count = document.createElement('div');
      count.className = 'scene-count';
      count.textContent = `${String(current + 1).padStart(2, '0')} / ${String(scenes.length).padStart(2, '0')}`;

      content.append(eyebrow, title, text, count);

      if (scene.theory) {
        const box = document.createElement('div');
        box.className = 'theory';
        box.innerHTML = scene.theory;
        content.appendChild(box);
      }

      chapterLabel.textContent = scene.label;
      progressBar.style.width = `${pct}%`;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === scenes.length - 1;
      firstBtn.disabled = current === 0;

      resetAutoTimer();
    }

    function goTo(index) {
      current = Math.max(0, Math.min(index, scenes.length - 1));
      renderScene();
    }

    function resetAutoTimer() {
      clearTimeout(autoTimer);
      if (!paused && current < scenes.length - 1) {
        autoTimer = setTimeout(() => goTo(current + 1), autoDelay);
      }
    }

    function togglePause() {
      paused = !paused;
      pauseBtn.textContent = paused ? '▶ 재생' : '⏸ 일시정지';
      if (paused) clearTimeout(autoTimer);
      else resetAutoTimer();
    }

    firstBtn.addEventListener('click', () => goTo(0));
    prevBtn.addEventListener('click', () => goTo(current - 1));
    nextBtn.addEventListener('click', () => goTo(current + 1));
    pauseBtn.addEventListener('click', togglePause);

    window.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight') goTo(current + 1);
      if (event.key === 'ArrowLeft') goTo(current - 1);
      if (event.code === 'Space') {
        event.preventDefault();
        togglePause();
      }
      if (event.key === 'Home') goTo(0);
    });

    renderScene(true);
  </script>
</body>
</html>
